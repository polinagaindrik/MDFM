[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_model"
version = "0.1.0"
description = "MDFM: Microbiome Data Fusion Model (core code)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyBIS==1.36.3",
    "pydantic<2.0",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "scikit-learn",
]

[project.optional-dependencies]
numba = ["numba"]                                 # ~6x faster ODE solves of fusion_model2
jax = ["jax>=0.4.30", "diffrax>=0.6.0"]           # exact derivatives (BACKEND = 'jax')

[tool.setuptools.packages.find]
include = ["fusion_model*"]
